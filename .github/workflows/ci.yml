name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go: ['1.27']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      # gofmt, vet and race tests — the same command the README gives.
      - run: make check

      # Checks the tree rather than named files: there is no go.sum to diff
      # while this package has no dependencies, and naming one that does not
      # exist fails for a reason that has nothing to do with tidiness.
      - name: go.mod is tidy
        run: |
          go mod tidy
          changed="$(git status --porcelain)"
          if [ -n "$changed" ]; then
            echo "go mod tidy changed something; commit the result:"
            echo "$changed"
            exit 1
          fi
